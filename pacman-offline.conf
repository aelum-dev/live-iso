#
# /etc/pacman.conf - Offline build configuration
# Used by mkarchiso for ISO builds (no network access)
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Never
LocalFileSigLevel = Never

# Only use the offline mirror during build
[aelum-offline]
SigLevel = Never
Server = file:///app/live-iso/airootfs/var/cache/aelum/offline-mirror