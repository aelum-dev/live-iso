# Aelum rEFInd theme
#
# Installed to EFI/refind/themes/aelum by the Aelum installer and pulled in
# from refind.conf with:
#     include themes/aelum/theme.conf
#
# All paths are relative to the rEFInd installation directory (EFI/refind),
# not to this file, which is how rEFInd resolves included theme options.

# Full-screen branded boot background (dark plum, Aelum lockup at the top).
banner themes/aelum/background.png
banner_scale fillscreen

# JetBrains Mono glyph sheet generated by live-iso/scripts/gen-refind-theme.py.
font themes/aelum/font.png

# OS icons: the Aelum tile replaces os_arch/os_linux; every icon not present
# here (Windows, macOS, EFI tools) falls back to rEFInd's default icon set.
icons_dir themes/aelum/icons
big_icon_size 128
small_icon_size 48

# Selection highlight drawn behind the focused icon.
selection_big themes/aelum/selection_big.png
selection_small themes/aelum/selection_small.png

# Keep the menu clean but leave labels and key hints visible.
hideui arrows,badges
