# Aelum rEFInd theme
#
# Installed to EFI/refind/themes/aelum by the Aelum installer and pulled in
# from refind.conf with:
#     include themes/aelum/theme.conf
#
# All paths are relative to the rEFInd installation directory (EFI/refind),
# not to this file, which is how rEFInd resolves included theme options.

# Full-screen boot background: the live ISO's solid dark colour (#141218) with
# the Aelum lockup at the top.
banner themes/aelum/background.png
banner_scale fillscreen

# JetBrains Mono glyph sheet generated by live-iso/scripts/gen-refind-theme.py.
# This is the 1x sheet; on HiDPI displays the installer adds
# `font themes/aelum/font-2x.png` to refind.conf because rEFInd does not scale
# custom fonts. Both sheets contain black glyphs (rEFInd inverts them on dark
# backgrounds to render white text).
font themes/aelum/font.png

# Complete themed icon set. rEFInd checks this directory before its stock
# icons/ directory, so every stock name is overridden: OS/distro icons on a
# cream tile with a plum Nerd Font glyph, the tools/functions row as light
# glyphs, volume badges as plum circles, and the arrows/mouse/boot logos.
# os_arch.png is the Aelum mark used by Aelum's own menu entries; auto-detected
# loaders get their own distro glyph (Arch for systemd-boot, Windows, Ventoy,
# Tux for generic Linux, and so on).
icons_dir themes/aelum/icons
big_icon_size 128
small_icon_size 48

# Selection highlight drawn behind the focused icon.
selection_big themes/aelum/selection_big.png
selection_small themes/aelum/selection_small.png

# Keep the menu clean but leave labels and key hints visible. The themed
# arrows and badges still ship, so removing either token shows themed icons
# instead of rEFInd's stock artwork.
hideui arrows,badges
