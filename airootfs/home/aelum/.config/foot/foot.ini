# Aelum live ISO — foot config.
#
# Both palettes are in this file, in foot's own dark/light theme sections, and
# /usr/local/bin/aelum-theme-watch.sh picks one by sending SIGUSR1 (dark) or
# SIGUSR2 (light) to running foot instances when the installer's light/dark
# toggle changes the hyprpaper wallpaper. foot starts in colors-dark, which is
# the palette hyprpaper starts with (bg-dark.png). The installed system does
# not use this file — it gets its colors from /etc/skel.

font = JetBrains Mono:size=12
pad = 8x8

[colors-dark]
# Matches the installer's dark scheme and the hyprpaper bg-dark wallpaper.
foreground = e6e0e9
background = 141218
cursor = 36275d cfbdfe
selection-foreground = 36275d
selection-background = cfbdfe
urls = cfbdfe

regular0 = 141218
regular1 = ff727e
regular2 = 9ef67b
regular3 = ffe072
regular4 = e99cd0
regular5 = 68355c
regular6 = f6b2e0
regular7 = ffeffb

bright0 = 494047
bright1 = ff9fa7
bright2 = bfffa5
bright3 = ffeba5
bright4 = ffc3eb
bright5 = ffcdef
bright6 = ffdff4
bright7 = fff8fd

[colors-light]
# Matches the installer's light scheme and the hyprpaper bg-light wallpaper.
foreground = 201a1e
background = fff7f9
cursor = fff7f9 834c74
selection-foreground = ffffff
selection-background = 834c74
urls = 834c74

regular0 = fff7f9
regular1 = 7c3138
regular2 = 346222
regular3 = 876e0f
regular4 = 894c79
regular5 = ffd7f0
regular6 = 834c74
regular7 = 242324

bright0 = 81737b
bright1 = 9d4e55
bright2 = 579040
bright3 = a1872b
bright4 = 965183
bright5 = aa789c
bright6 = aa86a0
bright7 = c4c0c3
