# Aelum live ISO kitty config.
#
# theme.conf is rewritten by /usr/local/bin/aelum-theme-watch.sh so kitty
# follows the installer's light/dark toggle (the same switch that changes the
# hyprpaper wallpaper). The installed system does not use this file — it gets
# its colors from DankMaterialShell via /etc/skel.
include theme.conf

remember_window_size no
window_padding_width 8
font_family JetBrains Mono
font_size 12
