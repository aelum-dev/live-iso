#
# /etc/pacman.conf — Offline ISO configuration
#
# This config is placed in airootfs/etc/pacman.conf before mkarchiso.
# It points pacman at the embedded offline mirror so the installed system
# has zero network dependency.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
NoProgressBar
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Offline mirror
[aestheticos-offline]
SigLevel = Never
Server = file:///var/cache/aestheticos/offline-mirror
