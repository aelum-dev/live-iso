#
# /etc/pacman.conf — Offline ISO configuration
#
# This config is placed in airootfs/etc/pacman.conf before the ISO build.
# It points pacman at the embedded offline mirror so the installed system
# has zero network dependency.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
NoProgressBar
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Offline mirror
[aelum-offline]
SigLevel = Never
Server = file:///var/cache/aelum/offline-mirror
