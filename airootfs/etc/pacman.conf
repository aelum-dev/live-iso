# Live system pacman.conf (offline)
# Points to the local repo packed inside the ISO at /repo/

[options]
SigLevel = PackageRequired
LocalFileSigLevel = Optional
Architecture = auto
ParallelDownloads = 5
#CheckSpace
#VerbosePkgLists

# Local curated repo (packed into the ISO at /repo/)
# SigLevel = Optional TrustAll allows unsigned packages from the local offline repo
[custom]
SigLevel = Optional TrustAll
Server = file:///repo

# All network repositories are intentionally disabled for offline operation.
# The curated repo contains every package needed to install a working system.
