# The live session's SSH exists for one thing: the QEMU harness in the distro's
# docker/ repo drives every install test through it (host 2222 → guest 22, root,
# empty password — see etc/ssh/sshd_config.d/10-archiso.conf). But the same image is
# also what a person boots on a network nobody owns and leaves running while they
# partition a disk, so an ungated sshd is an unauthenticated root login on the only
# interface the machine has. That is not a support channel; it is the exposure.
#
# So the unit is gated on the host's 9p share. shared-mount.service is what mounts
# that share, and having one is the one thing a harness boot has and a real boot
# never does: docker/scripts/run-iso.sh and docker/scripts/test-install.sh both pass
# -virtfs …,mount_tag=shared, and a released ISO boots with nothing to mount.
# Without the mount the condition is unmet and sshd never starts, so nothing listens
# on 22 at all — which beats any firewall rule, because there is no service to
# reach. The unit stays enabled: `systemctl status sshd` on a bare boot says
# "ConditionPathIsMountPoint=/shared failed", and someone who really wants SSH on a
# live system they are holding drops the condition with
# `systemctl edit --runtime sshd.service`.
[Unit]
# systemd weighs conditions the moment a unit is about to start, so the mount has to
# have been attempted first. shared-mount.service is enabled and stays active after
# mounting (RemainAfterExit), but nothing orders it against sshd, so ask for that
# here — otherwise the condition races the mount and the harness loses SSH.
After=shared-mount.service
ConditionPathIsMountPoint=/shared
