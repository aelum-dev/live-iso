# kms bakes the DRM/KMS drivers into the initramfs so the display switches to
# the native GPU mode early: amdgpu/radeon (AMD), i915/xe (Intel), nouveau
# (NVIDIA), plus virtio_gpu/vmwgfx for VMs. It pulls in every DRM module (the
# live ISO has no autodetect hook, deliberately: the image must boot on any
# hardware), and udev loads only the one matching the machine, so all vendors
# share one image. The live ISO ships no proprietary NVIDIA driver, so NVIDIA
# GPUs come up through nouveau here.
#
# aelum-live must stay after plymouth: it only talks to an already-started
# plymouthd, and its run_latehook has to fire after plymouth's, right before
# switch_root (see usr/lib/initcpio/hooks/aelum-live).
HOOKS=(base udev modconf kms archiso plymouth aelum-live block filesystems)
